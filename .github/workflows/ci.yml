name: CI

# Runs on the shared branches and on every PR into them. Deployment is
# deliberately not handled here: Azure CI/CD is being set up separately
# (develop -> test, main -> prod), so this workflow only proves the code is
# sound and leaves publishing alone.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser_scope:
        description: Browser diagnostics scope (only all qualifies a release)
        type: choice
        default: all
        options:
          - all
          - mobile-ui
          - mobile-play

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Tests
        run: node scripts/run.mjs scripts/testKql.ts

      # Renders the terminal to static HTML and asserts what a player actually
      # sees on open. A mount-only test would not have caught the sample-data
      # panel masquerading as a query result.
      - name: UI tests
        run: |
          node scripts/run.mjs scripts/testUi.tsx
          node scripts/run.mjs scripts/testNotes.tsx
          node scripts/run.mjs scripts/testPauseClock.ts
          node scripts/run.mjs scripts/testTouchInput.ts
          node scripts/run.mjs scripts/testCompactUi.tsx
          node scripts/run.mjs scripts/testViewport.ts
          node scripts/run.mjs scripts/testInputMode.ts
          node scripts/run.mjs scripts/testCompletionPlacement.ts

      - name: Case content and isolation
        run: |
          node scripts/run.mjs scripts/testCaseContent.ts
          node scripts/run.mjs scripts/testCases.ts

      - name: Performance regressions
        run: |
          node scripts/run.mjs scripts/testAudioScheduling.ts
          node scripts/run.mjs scripts/testPerfUi.tsx

      - name: Contributor authoring
        run: |
          node scripts/run.mjs scripts/checkContent.ts
          node scripts/run.mjs scripts/testAuthoring.ts
          node scripts/run.mjs scripts/testContentPreview.tsx

      - name: KQL reliability
        run: |
          node scripts/run.mjs scripts/testGrading.ts
          node scripts/run.mjs scripts/testQueryWorker.ts
          node scripts/run.mjs scripts/testQueryDrafts.ts

      - name: Difficulty question sets and progression
        run: |
          node scripts/run.mjs scripts/testQuestionSets.ts
          node scripts/run.mjs scripts/testDifficultyState.ts
          node scripts/run.mjs scripts/testDifficultyUi.tsx

      - name: Adapted curriculum
        run: |
          node seed/curriculum/seed-case001.mjs
          node seed/curriculum/seed-case002.mjs
          node seed/curriculum/seed-case003.mjs
          node seed/curriculum/seed-supplement.mjs
          node seed/curriculum/verify.mjs
          git diff --exit-code -- content/datasets
          node scripts/run.mjs scripts/testCurriculumLanguage.ts
          node scripts/run.mjs scripts/testCurriculumGrading.ts
          node scripts/run.mjs scripts/testCurriculumContent.ts
          node scripts/run.mjs scripts/testCurriculumUi.tsx

      # Adversarial input against the KQL parser. This is what caught the
      # stack overflow on deeply nested parentheses.
      - name: Fuzz
        run: node scripts/run.mjs scripts/fuzzKql.ts

      # Built at the domain root, which is how Azure Static Web Apps serves it.
      # If it is ever hosted under a sub-path instead, set BASE_PATH to that
      # prefix (see vite.config.ts) or every asset URL will 404.
      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Phaser renderer and gameplay
        timeout-minutes: 20
        env:
          BROWSER_SCOPE: ${{ inputs.browser_scope || 'all' }}
        run: |
          node scripts/serve.mjs 4173 > "$RUNNER_TEMP/phaser-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python -m unittest discover -s scripts -p testTouchGestures.py
          python scripts/runBrowserChecks.py --only "$BROWSER_SCOPE"

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: browser-reports
          if-no-files-found: ignore
          retention-days: 7

      # Lets a reviewer download and open the actual build for a PR without
      # having to check the branch out and install anything.
      - name: Upload build
        if: success() && (inputs.browser_scope == '' || inputs.browser_scope == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
